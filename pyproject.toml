[project]
name = "kannada-llm-bench"
version = "0.1.0"
description = "How many tokens Kannada costs in language model tokenizers, and a Kannada test suite for language models"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub==2.4.0",
    "tiktoken==0.14.0",
    "tokenizers==0.23.3",
]

[project.optional-dependencies]
chart = ["matplotlib==3.11.2"]

[project.scripts]
kbench = "kbench.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kbench"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Kannada digits and letters in strings are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: downloads tokenizer files"]
addopts = "-m 'not network'"
