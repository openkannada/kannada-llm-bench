name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
      - run: uv sync --extra chart --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run pytest -m network

  suite:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.17"
      - run: uv sync --locked
      - run: cargo test --manifest-path oracle/Cargo.toml --locked
      - run: cargo build --release --manifest-path oracle/Cargo.toml --locked
      - run: uv run kbench suite-build --oracle oracle/target/release/oracle --tasks reading translit numbers orthography
      - run: git diff --exit-code suite/items
